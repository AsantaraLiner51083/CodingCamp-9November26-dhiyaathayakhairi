
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagobert Expense & Budget Visualizer</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    
    <header class="header">
        <h1>Expense Tracker</h1>
        <p>Manage your daily expenses</p>
        <button id="theme-toggle">Switch Dark Mode</button>
    </header>


    <main class="container">

        <!-- Total Pengeluaran -->
        <section class="summary-card">
            <p>Total Expenses</p>
            <h2 id="total-expenses">Rp0</h2>
        </section>


        <section class="card">
            <h2>Budget Limit</h2>

            <label for="budget-limit">Monthly Spending Limit (Rp)</label>

            <input
                type="number"
                id="budget-limit"
                placeholder="Contoh: 1000000"
                min="1"
            >

            <p id="budget-warning">
                You are within your budget.
            </p>
        </section>


        <!-- Form Transaksi -->
        <section class="card">
            <h2>Add Transaction</h2>

            <form id="expense-form">

                <label for="item-name">Item Name</label>
                <input
                    type="text"
                    id="item-name"
                    placeholder="Contoh: Lunch"
                    required
                >

                <label for="amount">Amount (Rp)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Contoh: 25000"
                    min="1"
                    required
                >

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Choose category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Fun">Fun</option>
                </select>

                <button type="submit">Add Transaction</button>

            </form>
        </section>

        <!-- Daftar Transaksi -->
        <section class="card">
            <h2>Transaction History</h2>


            <label for="sort-transactions">Sort by Amount</label>

            <select id="sort-transactions">
                <option value="default">Default Order</option>
                <option value="ascending">Lowest Amount</option>
                <option value="descending">Highest Amount</option>
            </select>


            <ul id="transaction-list">
                <li class="empty-message">
                    No transactions yet.
                </li>
            </ul>
        </section>

        <!-- Grafik -->
        <section class="card">
            <h2>Spending Distribution</h2>

            <div class="chart-container">
                <canvas id="expense-chart"></canvas>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
